name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Windows x64
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate icons
        run: python tools/make_icon.py

      - name: Build executable
        run: python -m PyInstaller --noconfirm --clean Zamzam.spec

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Zamzam-windows-x64
          path: dist/Zamzam.exe
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: Zamzam-windows-x64
          path: dist

      - name: Create checksums
        shell: pwsh
        run: |
          $hash = (Get-FileHash dist\Zamzam.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  Zamzam.exe" | Set-Content dist\SHA256SUMS.txt -Encoding ascii
          Get-Content dist\SHA256SUMS.txt

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" `
            "dist\Zamzam.exe" `
            "dist\SHA256SUMS.txt" `
            --title "Zamzam ${{ github.ref_name }}" `
            --generate-notes
